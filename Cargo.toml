[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/capsulerun/prober"

[workspace.dependencies]
prober-core = { path = "crates/core" }
prober-vcs = { path = "crates/vcs" }
prober-lang-typescript = { path = "crates/lang-typescript" }
prober-lang-python = { path = "crates/lang-python" }
prober-lang-rust = { path = "crates/lang-rust" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dunce = "1"
gix = { version = "0.88", default-features = false, features = ["sha1", "revision", "blob-diff", "max-performance-safe"] }
globset = "0.4"
json-strip-comments = "3"
oxc_allocator = "0.146"
oxc_ast = "0.146"
oxc_ast_visit = "0.146"
oxc_parser = "0.146"
oxc_resolver = "11"
oxc_semantic = "0.146"
oxc_span = "0.146"
quick-xml = "0.42"
ra_ap_syntax = "=0.0.357"
rayon = "1"
regex = "1"
ruff_python_ast = "=0.0.17"
ruff_python_parser = "=0.0.17"
ruff_text_size = "=0.0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
yaml-rust2 = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dist]
inherits = "release"
lto = "thin"
