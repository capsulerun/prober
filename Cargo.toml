[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/capsulerun/prober"

[workspace.dependencies]
prober-core = { path = "crates/core" }
prober-vcs = { path = "crates/vcs" }
prober-lang-typescript = { path = "crates/lang-typescript" }
prober-lang-python = { path = "crates/lang-python" }
prober-lang-rust = { path = "crates/lang-rust" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
gix = { version = "0.88", default-features = false, features = ["sha1", "revision", "blob-diff", "max-performance-safe"] }
globset = "0.4"
oxc_allocator = "0.146"
oxc_ast = "0.146"
oxc_ast_visit = "0.146"
oxc_parser = "0.146"
oxc_resolver = "11"
oxc_span = "0.146"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "forbid"
