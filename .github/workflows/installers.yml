name: Installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to check, e.g. v0.1.0-rc.1
        required: true

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Install (${{ matrix.os }})
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Shell installer
        if: runner.os != 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/capsulerun/prober/releases/download/$TAG/prober-installer.sh" | sh
          "$HOME/.local/bin/prober" --version | tee version.txt
          grep -qx "prober ${TAG#v}" version.txt

      - name: PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -c "irm https://github.com/capsulerun/prober/releases/download/$env:TAG/prober-installer.ps1 | iex"
          $version = & "$HOME/.local/bin/prober.exe" --version
          Write-Output $version
          if ($version -ne "prober $($env:TAG.TrimStart('v'))") { exit 1 }

  verify:
    runs-on: ubuntu-latest
    name: Checksums and attestations
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release

      - name: Checksums
        working-directory: release
        run: |
          for checksum in prober-*.sha256; do
            sha256sum --check "$checksum"
            hash=$(cut -d ' ' -f 1 "$checksum")
            grep -q "$hash" prober-installer.sh
          done

      - name: Attestations
        working-directory: release
        run: |
          for archive in prober-*.tar.xz prober-*.zip; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done

  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Action (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7

      - name: Install, cold
        uses: ./
        with:
          version: ${{ inputs.tag }}
          base: HEAD

      - name: Install, from the tool cache
        uses: ./
        with:
          version: ${{ inputs.tag }}
          base: HEAD
