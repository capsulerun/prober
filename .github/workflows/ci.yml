name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  tests:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: Select crates
        id: select
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cargo build --quiet -p prober
          ./target/debug/prober --base "origin/$BASE_REF" --format json > selection.json
          echo "mode=$(jq -r .mode selection.json)" >> "$GITHUB_OUTPUT"
          echo "packages=$(jq -r '[.targets.rust // [] | .[].crate | "-p " + .] | join(" ")' selection.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Prober selection: $(jq -r .mode selection.json)"
            jq -r '.targets.rust // [] | .[].crate | "- `" + . + "`"' selection.json
            jq -r '(.mode_reasons // [])[] | "- " + .message' selection.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ steps.select.outputs.mode }}
          PACKAGES: ${{ steps.select.outputs.packages }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$MODE" = "all" ]; then
            cargo test --workspace
          elif [ -n "$PACKAGES" ]; then
            cargo test $PACKAGES
          else
            echo "No crate is reached by this change"
          fi
