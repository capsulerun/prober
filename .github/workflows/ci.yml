name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Tests (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: Select crates
        id: prober
        if: github.event_name == 'pull_request'
        uses: ./

      - name: Test
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ steps.prober.outputs.mode }}
          CRATES: ${{ steps.prober.outputs.rust-file }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$MODE" = "all" ]; then
            cargo test --workspace
          elif [ -s "$CRATES" ]; then
            sed 's/^/-p /' "$CRATES" | xargs cargo test
          else
            echo "No crate is reached by this change"
          fi
